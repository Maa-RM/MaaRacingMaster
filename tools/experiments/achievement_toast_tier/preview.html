<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成就灵动岛 · 三态预览</title>
<style>
/* ============================================================
   成就灵动岛原型
   三态：紧凑（圆）→ 展开（胶囊：标题 + 描述）→ 详情卡
   四档：普通 / 稀有 / 珍贵 / 隐藏，色彩落在整条外圈描边上
   多个成就：堆叠，新的在前；展示时间串行，每条 5 秒
   ============================================================ */

:root {
  --maarm-background: #F5F6FA;
  --maarm-surface: #FFFFFF;
  --maarm-foreground: #1F2328;
  --maarm-foreground-secondary: #4A5160;
  --maarm-foreground-muted: #8B93A7;
  --maarm-border: #E5E7EB;
  --maarm-border-light: #EEF0F4;
  --maarm-primary: #E5484D;
  --maarm-success: #10B981;
  --maarm-font-sans: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --k: 1;   /* 节奏倍数：慢放时拉长形变时长（不影响 5 秒停留） */
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  padding: 20px 16px 24px;
  background: #E9EBF1;
  font-family: var(--maarm-font-sans);
  color: var(--maarm-foreground);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.fit { width: 100%; display: flex; justify-content: center; }
.stage { width: min(1180px, 100%); display: flex; flex-direction: column; gap: 18px; }

/* ---------- 模拟窗口 ---------- */
.shell {
  position: relative;
  width: 100%;
  height: 720px;
  background: var(--maarm-background);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(16, 18, 24, .18), 0 0 0 1px rgba(16, 18, 24, .06);
  display: flex;
  flex-direction: column;
}

.titlebar {
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--maarm-surface);
  border-bottom: 1px solid var(--maarm-border-light);
  font-size: 12px;
}
.brand { font-weight: 600; font-size: 13px; }
.ver { color: var(--maarm-foreground-muted); }
.tabs { display: flex; gap: 26px; margin-left: 26px; }
.tab {
  background: none; border: 0; padding: 14px 0; font: inherit; font-size: 13px;
  color: var(--maarm-foreground-secondary); cursor: default; position: relative;
}
.tab--active { color: var(--maarm-foreground); font-weight: 600; }
.tab--active::after {
  content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 28px; height: 2px; border-radius: 2px; background: var(--maarm-primary);
}
.winbtns { margin-left: auto; display: flex; gap: 16px; color: var(--maarm-foreground-muted); }

.content { flex: 1 1 auto; display: flex; gap: 16px; padding: 16px; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col--left { flex: 0 0 60%; }
.col--right { flex: 1 1 auto; }

.panel {
  background: var(--maarm-surface);
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
  display: flex; flex-direction: column; min-height: 0;
}
.panel--fill { flex: 1 1 auto; }
.panel__head {
  padding: 14px 16px 10px; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
}
.panel__body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

.row {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--maarm-border-light);
  border-radius: 8px; padding: 12px 14px;
  font-size: 13px; color: var(--maarm-foreground-secondary);
}
.row__name { color: var(--maarm-foreground); font-weight: 500; }
.row__meta { color: var(--maarm-foreground-muted); font-size: 12px; }
.row__tag {
  margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--maarm-border-light); color: var(--maarm-foreground-secondary);
}
.log-row {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border: 1px solid var(--maarm-border-light); border-radius: 8px;
  font-size: 12.5px; color: var(--maarm-foreground-secondary);
}
.log-row__badge { font-size: 11px; padding: 1px 7px; border-radius: 4px; font-weight: 600; }
.log-row__badge--ok { color: #0f7a55; background: rgba(16, 185, 129, .12); }
.log-row__badge--warn { color: #a56407; background: rgba(245, 158, 11, .14); }
.log-row__time { margin-left: auto; color: var(--maarm-foreground-muted); font-variant-numeric: tabular-nums; }

.statusbar {
  flex: 0 0 44px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--maarm-surface);
  border-top: 1px solid var(--maarm-border-light);
  font-size: 12.5px; color: var(--maarm-foreground-secondary);
}
.status { display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--maarm-success); display: inline-block; }
.statusbar .actions { margin-left: auto; display: flex; gap: 10px; }
.btn {
  font: inherit; font-size: 12.5px; border-radius: 7px; padding: 7px 16px;
  border: 1px solid var(--maarm-border); background: var(--maarm-surface);
  color: var(--maarm-foreground-secondary); cursor: default;
}
.btn--primary { background: var(--maarm-primary); border-color: var(--maarm-primary); color: #fff; font-weight: 600; }

/* 礼花画布：盖满窗口、不吃鼠标事件，层级在岛之下（不影响读卡） */
#fx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 4;
}

/* ============================================================
   灵动岛容器
   ============================================================ */
.island {
  position: absolute;
  left: 0; right: 0;
  bottom: 68px;                 /* 状态栏（44px）上方留 24px */
  height: 0;
  pointer-events: none;         /* 空白区域不吃鼠标事件 */
  z-index: 5;
}

/* ============================================================
   单条成就：一个盒子在三种尺寸间变形
   ============================================================ */
.ach {
  --ach-h: 56px;                /* 紧凑态直径 / 展开态高度 */
  --ach-ring-w: 2.5px;          /* 档位描边宽度 */
  --ach-ring: #1F2328;          /* 档位色，落在整条外圈描边 */
  --dy: 0px;                    /* 堆叠上移量 */

  position: absolute;
  left: 0;
  right: 0;
  margin: 0 auto;               /* 水平居中用外边距，不靠 transform */
  bottom: var(--dy);            /* 堆叠位置也用布局属性，不用 translateY */
  width: var(--ach-h);
  height: var(--ach-h);
  /* 圆角取高度的一半：既是标准胶囊端头，又不会像 999px 那样被盒子尺寸钳制，
     胶囊 → 详情卡的圆角变化才能在形变过程中真正看得见 */
  border-radius: calc(var(--ach-h) / 2);
  /* 双背景描边：内层铺底色，外层铺档位色，四档几何完全一致 */
  border: var(--ach-ring-w) solid transparent;
  background:
    linear-gradient(var(--maarm-surface), var(--maarm-surface)) padding-box,
    var(--ach-ring) border-box;
  box-shadow: 0 12px 32px rgba(16, 18, 24, .16), 0 2px 6px rgba(16, 18, 24, .06);
  overflow: hidden;
  cursor: pointer;
  pointer-events: auto;
  opacity: 0;
  transform: scale(.18);        /* 仅在入场那一下用；入场结束后回到 none */
  transition:
    width calc(460ms / var(--k)) cubic-bezier(.2, .9, .25, 1.05),
    height calc(320ms / var(--k)) cubic-bezier(.4, 0, .2, 1),
    border-radius calc(320ms / var(--k)) cubic-bezier(.4, 0, .2, 1),
    bottom calc(300ms / var(--k)) cubic-bezier(.4, 0, .2, 1),
    opacity calc(240ms / var(--k)) ease,
    transform calc(280ms / var(--k)) cubic-bezier(.2, .9, .25, 1.05);
  /* 不断写 will-change，静止态也不保留 transform：任何一项都会把元素留在合成层上，
     文字抗锯齿退化成灰度渲染，反复切换后就呈现「有时清晰有时发虚」 */
}
.ach.is-shown { opacity: 1; transform: none; }
.ach[data-state="detail"] { border-radius: 18px; }

/* 主面：图标 + 标题 + 描述，固定贴在内区顶部（高度扣掉描边） */
.ach__face {
  display: flex;
  align-items: center;
  height: calc(var(--ach-h) - var(--ach-ring-w) * 2);
  transition: opacity calc(200ms / var(--k)) ease;
}
.ach__badge {
  flex: 0 0 auto;
  height: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.ach__badge svg {
  width: 26px; height: 26px;
  fill: none; stroke: var(--maarm-foreground); stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round;
}

.ach__text {
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 0 20px 0 6px;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-8px);
  transition:
    opacity calc(220ms / var(--k)) ease calc(100ms / var(--k)),
    transform calc(320ms / var(--k)) cubic-bezier(.2, .9, .25, 1) calc(80ms / var(--k));
}
.ach__title { font-size: 15px; font-weight: 600; line-height: 1.25; color: var(--maarm-foreground); }
.ach__sub { font-size: 12px; line-height: 1.2; color: var(--maarm-foreground-muted); }

.ach[data-state="stacked"] .ach__text,
.ach[data-state="detail"] .ach__text { opacity: 1; transform: none; }
.ach[data-state="detail"] .ach__face { opacity: 0; }

/* 详情卡：绝对定位铺满，不参与尺寸计算 */
.ach__detail {
  position: absolute;
  inset: 0;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  transition:
    opacity calc(240ms / var(--k)) ease,
    transform calc(300ms / var(--k)) cubic-bezier(.2, .9, .25, 1);
}
.ach[data-state="detail"] .ach__detail { opacity: 1; transform: none; }

.ach__detail-head { display: flex; align-items: center; gap: 8px; }
.ach__detail-title { font-size: 15px; font-weight: 600; color: var(--maarm-foreground); }
.ach__tier {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--maarm-border-light); color: var(--maarm-foreground-secondary);
}
.ach__tier::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--ach-dot, var(--ach-ring));
}
.ach__time { margin-left: auto; font-size: 11px; color: var(--maarm-foreground-muted); font-variant-numeric: tabular-nums; }
.ach__detail-desc { font-size: 13px; line-height: 1.45; color: var(--maarm-foreground-secondary); }
.ach__detail-cond {
  margin-top: auto;
  font-size: 11.5px; line-height: 1.4; color: var(--maarm-foreground-muted);
  border-top: 1px solid var(--maarm-border-light);
  padding-top: 8px;
}

/* ---------- 档位：整条胶囊的描边 ---------- */
.ach[data-tier="normal"] { --ach-ring: #1F2328; }
.ach[data-tier="rare"] { --ach-ring: #38BDF8; }
.ach[data-tier="precious"] { --ach-ring: var(--maarm-primary); }

@property --ach-spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes ach-spin { to { --ach-spin: 360deg; } }
/* 隐藏：色环走元素自身的 border-box 背景，与其它三档同一套几何（
   伪元素画环会被 overflow:hidden 在 padding-box 处裁掉，不能用） */
.ach[data-tier="hidden"] {
  --ach-ring: conic-gradient(from var(--ach-spin) in oklch longer hue,
    oklch(.72 .16 0deg), oklch(.72 .16 360deg));
  /* 档位小圆点单独给一个静态色环，避免依赖正在旋转的 --ach-spin */
  --ach-dot: conic-gradient(in oklch longer hue, oklch(.72 .16 0deg), oklch(.72 .16 360deg));
  animation: ach-spin 3.2s linear infinite;
}
.ach[data-tier="hidden"] .ach__title,
.ach[data-tier="hidden"] .ach__detail-title {
  --maarm-scan-cycle: 3.2s;
}

/* ============================================================
   彩虹字（照搬 frontend/style.css 的 .maarm-text-scan--rave）
   ============================================================ */
@property --maarm-scan-hue { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.maarm-text-scan {
  --maarm-scan-base: currentColor;
  --maarm-scan-beam: #FFFFFF;
  --maarm-scan-angle: 100deg;
  --maarm-scan-half: 5%;
  --maarm-scan-span: 250%;
  --maarm-scan-cycle: 6s;
  --maarm-scan-timing: linear(0, 1 30%, 1 100%);
  --maarm-scan-hue-cycle: 6s;
  --maarm-scan-anim: maarm-text-scan var(--maarm-scan-cycle) var(--maarm-scan-timing) infinite;

  background-image:
    linear-gradient(var(--maarm-scan-angle),
      transparent calc(50% - var(--maarm-scan-half)),
      var(--maarm-scan-beam) 50%,
      transparent calc(50% + var(--maarm-scan-half))),
    linear-gradient(var(--maarm-scan-base), var(--maarm-scan-base));
  background-size: var(--maarm-scan-span) 100%, 100% 100%;
  background-repeat: no-repeat;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: var(--maarm-scan-anim);
}
@keyframes maarm-text-scan {
  from { background-position: 100% 0, 0 0; }
  to   { background-position: 0% 0, 0 0; }
}
.maarm-text-scan--rave {
  --maarm-scan-rainbow-l: 0.7;
  --maarm-scan-rainbow-c: 0.16;
  --maarm-scan-beam: #FFFFFF;
  --maarm-scan-weight: 600;
  --maarm-scan-hue-cycle: 3.2s;
  --maarm-scan-anim: maarm-text-scan var(--maarm-scan-cycle) var(--maarm-scan-timing) infinite,
                     maarm-text-scan-hue var(--maarm-scan-hue-cycle) linear infinite;
  --maarm-scan-base-layer: linear-gradient(90deg in oklch longer hue,
    oklch(var(--maarm-scan-rainbow-l) var(--maarm-scan-rainbow-c) var(--maarm-scan-hue)),
    oklch(var(--maarm-scan-rainbow-l) var(--maarm-scan-rainbow-c) var(--maarm-scan-hue)));
  background-image:
    linear-gradient(var(--maarm-scan-angle),
      transparent calc(50% - var(--maarm-scan-half)),
      var(--maarm-scan-beam) 50%,
      transparent calc(50% + var(--maarm-scan-half))),
    var(--maarm-scan-base-layer);
  font-weight: var(--maarm-scan-weight);
}
@keyframes maarm-text-scan-hue {
  from { --maarm-scan-hue: 0deg; }
  to   { --maarm-scan-hue: 360deg; }
}

/* ---------- 预览控件 ---------- */
.controls {
  width: 100%;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-size: 12.5px; color: var(--maarm-foreground-secondary);
}
.controls .hint { color: var(--maarm-foreground-muted); margin-right: 4px; }
.chip {
  font: inherit; font-size: 12.5px; padding: 8px 14px; border-radius: 8px;
  border: 1px solid #D5D9E2; background: #fff; color: var(--maarm-foreground);
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.chip:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 18, 24, .08); }
.chip:active { transform: translateY(0); }
.chip__dot { width: 10px; height: 10px; border-radius: 50%; }
.chip__dot--normal { background: #1F2328; }
.chip__dot--rare { background: #38BDF8; }
.chip__dot--precious { background: var(--maarm-primary); }
.chip__dot--hidden { background: conic-gradient(in oklch longer hue, oklch(.72 .16 0deg), oklch(.72 .16 360deg)); }
.spacer { flex: 1 1 auto; }

@media (max-width: 780px) {
  .col--right { display: none; }
  .col--left { flex: 1 1 auto; }
  .shell { height: 560px; }
}

@media (prefers-reduced-motion: reduce) {
  .ach { transition: opacity 150ms ease, width 150ms ease, height 150ms ease !important; transform: none !important; }
  .ach__badge, .ach[data-tier="hidden"] { animation: none !important; }
  .maarm-text-scan { animation: none; }
}
</style>
</head>
<body>

<div class="fit">
<div class="stage">
<div class="shell" id="shell">
  <header class="titlebar">
    <span class="brand">MaaRM</span>
    <span class="ver">v0.31.0-dev.1+113（源码模式）</span>
    <nav class="tabs">
      <button class="tab tab--active">主控</button>
      <button class="tab">数据</button>
      <button class="tab">设置</button>
      <button class="tab">关于</button>
    </nav>
    <div class="winbtns"><span>—</span><span>▢</span><span>✕</span></div>
  </header>

  <main class="content">
    <section class="col col--left">
      <div class="panel">
        <div class="panel__head">运行任务</div>
        <div class="panel__body">
          <div class="row"><span>🚀</span><span class="row__name">启动游戏</span><span class="row__meta">等待窗口 120s</span><span class="row__tag">进行中</span></div>
          <div class="row"><span>🏎️</span><span class="row__name">极速狂飙</span><span class="row__meta">录制：关 · 深度几何</span><span class="row__tag">已停止</span></div>
          <div class="row"><span>🛑</span><span class="row__name">关闭游戏</span><span class="row__meta">—</span></div>
        </div>
      </div>
      <div class="panel panel--fill">
        <div class="panel__head">今日战绩</div>
        <div class="panel__body">
          <div class="row"><span class="row__name">今日回合</span><span class="row__tag">12</span></div>
          <div class="row"><span class="row__name">今日胜场</span><span class="row__tag">7</span></div>
        </div>
      </div>
    </section>

    <section class="col col--right">
      <div class="panel panel--fill">
        <div class="panel__head">运行日志</div>
        <div class="panel__body">
          <div class="log-row"><span class="log-row__badge log-row__badge--ok">成功</span><span>[极速狂飙] 第 1 场开始</span><span class="log-row__time">16:49:38</span></div>
          <div class="log-row"><span class="log-row__badge log-row__badge--warn">警告</span><span>[极速狂飙] 驾驶阶段 1（等待阶段结束）</span><span class="log-row__time">16:50:09</span></div>
          <div class="log-row"><span class="log-row__badge log-row__badge--ok">成功</span><span>[极速狂飙] 第 2 场开始</span><span class="log-row__time">16:52:01</span></div>
          <div class="log-row"><span class="log-row__badge log-row__badge--ok">成功</span><span>[极速狂飙] 运行收尾</span><span class="log-row__time">16:54:11</span></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="status"><i class="dot"></i>系统就绪</span>
    <div class="actions">
      <button class="btn">■ 停止</button>
      <button class="btn btn--primary">▶ 开始运行</button>
    </div>
  </footer>

  <!-- 灵动岛：成就条目会被动态插入这里 -->
  <div class="island" id="island" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<div class="controls">
  <span class="hint">触发（或按 1–4）：</span>
  <button class="chip" data-tier="normal"><i class="chip__dot chip__dot--normal"></i>普通</button>
  <button class="chip" data-tier="rare"><i class="chip__dot chip__dot--rare"></i>稀有</button>
  <button class="chip" data-tier="precious"><i class="chip__dot chip__dot--precious"></i>珍贵</button>
  <button class="chip" data-tier="hidden"><i class="chip__dot chip__dot--hidden"></i>隐藏</button>
  <span class="spacer"></span>
  <button class="chip" id="btnBurst">同时触发四条</button>
  <button class="chip" id="btnClear">清空</button>
  <button class="chip" id="btnSpeed">慢放 ×1.8</button>
</div>
</div>
</div>

<script>
(() => {
  const ISLAND = document.getElementById('island');
  const SHELL = document.getElementById('shell');
  const H = 56;              // 胶囊高度（入场/退场时的圆直径）
  const GAP = 8;             // 堆叠间距
  const HOLD = 5000;         // 队首展示时长
  const IDLE = 9000;         // 详情卡无人点击时自动收回
  const CARD_W = 320;        // 详情卡宽度
  const CARD_H = 156;        // 详情卡高度

  /* 四个示例成就：标题 / 描述 / 触发条件 */
  const BOOK = {
    normal:   { tier: '普通', title: '哦，对的对的', desc: '欢迎您使用MaaRM！',
                cond: '第一次按下开始运行按钮' },
    rare:     { tier: '稀有', title: '嗯，不对不对', desc: '是不是哪里没调整好？',
                cond: '第一次在开始的三秒倒计时内打断开始运行' },
    precious: { tier: '珍贵', title: '哎呀，对的对的！', desc: '刚刚是我看岔眼了！',
                cond: '第一次在一分钟内尝试开始运行两次' },
    hidden:   { tier: '隐藏', title: '对...对吗？', desc: '真是纠纠又结结啊...',
                cond: '第一次在一分钟内尝试打断运行两次' },
  };

  const speed = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k')) || 1;

  const items = [];          // 旧 → 新：第一条在最前（下方），后来的往上排
  let frontTimer = null;     // 队首的 5 秒计时
  let idleTimer = null;

  const now = () => {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  /* ---------- 礼花：仅隐藏档触发 ---------- */
  const FX = (() => {
    const cv = document.getElementById('fx');
    const ctx = cv.getContext('2d');
    const COLORS = ['#38BDF8', '#E5484D', '#F5B23F', '#34D399', '#A78BFA', '#FB7185'];
    let W = 0, H = 0, raf = 0, last = 0, pending = 0;
    const parts = [];

    function fit() {
      const box = SHELL.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = box.width; H = box.height;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      cv.style.width = `${W}px`;
      cv.style.height = `${H}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /** 从底部两侧的角落向中心斜上方喷出的一片纸屑 */
    function burstSide(fromLeft) {
      const dir = fromLeft ? 1 : -1;
      for (let i = 0; i < 30; i++) {
        const angle = (26 + Math.random() * 58) * Math.PI / 180;   // 26°–84°，扇形开口要够大
        // 由目标射程反推水平初速（该阻力模型下射程≈ 0.44 × 水平初速）；
        // 射程差异拉大，近远分层，才不会糊成一根柱子
        const reach = (.30 + Math.random() * .62) * W;
        const speed = Math.min(1950, (reach / .44) / Math.cos(angle));
        parts.push({
          // 发射点沿底边散开一段，避免所有纸屑同一个点出发
          x: dir > 0 ? -10 - Math.random() * 60 : W + 10 + Math.random() * 60,
          y: H + 8 + Math.random() * 34,
          vx: dir * Math.cos(angle) * speed,
          vy: -Math.sin(angle) * speed,
          w: 4 + Math.random() * 7,
          h: 8 + Math.random() * 10,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - .5) * 16,
          phase: Math.random() * Math.PI * 2,
          age: 0,
          delay: Math.random() * .28,            // 错峰出发，避免一口气喷成一根实心柱
          life: 4.6 + Math.random() * 1.4,
          drag: .009 + Math.random() * .004,     // 阻力系数：每片略不同，落得才有层次
          chuteAt: .20 + Math.random() * .14,    // 开伞时刻也错开，避免整齐刹车
          color: COLORS[(Math.random() * COLORS.length) | 0],
        });
      }
    }

    function step(ts) {
      const dt = Math.min(.032, (ts - (last || ts)) / 1000);
      last = ts;
      const t = ts / 1000;
      ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += dt;
        const a = p.age - p.delay;                 // 去掉还没轮到出发的时间
        if (a < 0) continue;
        if (a > p.life) { parts.splice(i, 1); continue; }
        // 像开伞：开伞前阻力很小，让纸屑先射出去；开伞瞬间阻力骤增，
        // 速度很快掉到终端速度（约 60–80 px/s），之后才缓缓飘落
        const spd = Math.hypot(p.vx, p.vy);
        const k = p.drag * (a < p.chuteAt ? .18 : 1) * spd;
        p.vx -= k * p.vx * dt;
        p.vy -= k * p.vy * dt;
        p.vy += 70 * dt;                                 // 重力：很轻
        p.vx += Math.sin(t * 2 + p.phase) * 22 * dt;       // 飘落时左右轻摆
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vrot * dt;
        if (p.y > H + 80 || p.x < -140 || p.x > W + 140) { parts.splice(i, 1); continue; }

        ctx.save();
        ctx.globalAlpha = Math.min(1, (p.life - a) / .5) * .95;   // 末尾淡出
        ctx.fillStyle = p.color;
        // 纸屑翻面：横向宽度随时间收缩再展开
        const flutter = .35 + .65 * Math.abs(Math.cos(t * 5 + p.phase));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.w * flutter / 2, -p.h / 2, p.w * flutter, p.h);
        ctx.restore();
      }
      if (parts.length || pending) raf = requestAnimationFrame(step);
      else { raf = 0; last = 0; ctx.clearRect(0, 0, W, H); }
    }

    function schedule(fn, ms) {
      pending++;
      setTimeout(() => { pending--; fn(); }, ms);
    }

    function burst() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      fit();
      // 两波，第二波补上，避免一次喷完只剩零散几片
      schedule(() => { burstSide(true); burstSide(false); }, 0);
      schedule(() => { burstSide(true); burstSide(false); }, 260);
      if (!raf) { last = 0; raf = requestAnimationFrame(step); }
    }

    window.addEventListener('resize', fit);
    return { burst };
  })();

  /* ---------- 创建 ---------- */
  function createItem(tier) {
    const data = BOOK[tier];
    const el = document.createElement('article');
    el.className = 'ach';
    el.dataset.tier = tier;
    el.dataset.state = 'stacked';
    el.innerHTML = `
      <div class="ach__face">
        <div class="ach__badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
            <path d="M7 5H4.5v1.5A3.5 3.5 0 0 0 8 10"/>
            <path d="M17 5h2.5v1.5A3.5 3.5 0 0 1 16 10"/>
            <path d="M12 14v3"/><path d="M9 20h6"/>
          </svg>
        </div>
        <div class="ach__text">
          <div class="ach__title${tier === 'hidden' ? ' maarm-text-scan maarm-text-scan--rave' : ''}"></div>
          <div class="ach__sub"></div>
        </div>
      </div>
      <div class="ach__detail">
        <div class="ach__detail-head">
          <span class="ach__detail-title${tier === 'hidden' ? ' maarm-text-scan maarm-text-scan--rave' : ''}"></span>
          <span class="ach__tier"></span>
          <span class="ach__time"></span>
        </div>
        <div class="ach__detail-desc"></div>
        <div class="ach__detail-cond"></div>
      </div>`;

    // 副标题只放描述，档位由描边和详情卡承担
    el.querySelector('.ach__title').textContent = data.title;
    el.querySelector('.ach__sub').textContent = data.desc;
    el.querySelector('.ach__detail-title').textContent = data.title;
    el.querySelector('.ach__tier').textContent = data.tier + '成就';
    el.querySelector('.ach__time').textContent = now() + ' 解锁';
    el.querySelector('.ach__detail-desc').textContent = data.desc;
    el.querySelector('.ach__detail-cond').textContent = '触发条件：' + data.cond;

    el.style.width = `${H}px`;
    el.style.height = `${H}px`;

    const item = { el, tier, state: 'stacked' };
    el.addEventListener('click', (e) => { e.stopPropagation(); onItemClick(item); });
    ISLAND.appendChild(el);
    items.push(item);
    layout();
    if (tier === 'hidden') FX.burst();     // 隐藏档触发时放礼花

    // 入场：先以圆点弹出，再展开成胶囊入队
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add('is-shown');
      setTimeout(() => {
        if (item.state !== 'stacked') return;
        el.style.width = `${fullWidth(el)}px`;
      }, 200);
    }));
    return item;
  }

  /* ---------- 布局：旧的在前（下方），新的往上排 ---------- */
  function layout() {
    let y = 0;
    items.forEach((item, i) => {
      item.el.style.setProperty('--dy', `${y}px`);
      item.el.style.zIndex = String(100 - i);
      y += (item.state === 'detail' ? CARD_H : H) + GAP;
    });
  }

  /* ---------- 尺寸 ---------- */
  function fullWidth(el) {
    const prevW = el.style.width;
    const prevR = el.style.right;
    el.style.transition = 'none';
    // 绝对定位同时有 left/right 时 width:auto 会撑满整行，量宽前必须先放开 right
    el.style.right = 'auto';
    el.style.width = 'auto';
    const w = Math.min(el.offsetWidth, 460);
    el.style.width = prevW || `${H}px`;
    el.style.right = prevR;
    void el.offsetWidth;               // 强制重排，让下一步宽度变化从当前尺寸起步
    el.style.transition = '';
    return w;
  }

  function toggleDetail(item) {
    const el = item.el;
    if (item.state === 'detail') {
      item.state = 'stacked';
      el.dataset.state = 'stacked';
      el.style.width = `${fullWidth(el)}px`;
      el.style.height = `${H}px`;
    } else {
      item.state = 'detail';
      el.dataset.state = 'detail';
      el.style.width = `${CARD_W}px`;
      el.style.height = `${CARD_H}px`;
    }
    layout();
  }

  /* ---------- 串行推进：队首展示满 5 秒即消失，后一条顶上 ---------- */
  function startFrontTimer() {
    clearTimeout(frontTimer);
    const front = items[0];
    if (!front) return;
    frontTimer = setTimeout(() => {
      if (items[0] !== front || front.state === 'detail') return;
      dismiss(front);
    }, HOLD);
  }

  function resumeTimer() {
    clearTimeout(frontTimer);
    if (items.some((it) => it.state === 'detail')) return;   // 用户正展开某条，计时暂停
    startFrontTimer();
  }

  function dismiss(item) {
    const i = items.indexOf(item);
    if (i < 0) return;
    items.splice(i, 1);
    clearTimeout(frontTimer);
    const el = item.el;
    el.classList.remove('is-shown');    // 缩回圆并淡出
    el.style.width = `${H}px`;
    el.style.height = `${H}px`;
    setTimeout(() => el.remove(), 420);
    layout();
    startFrontTimer();                  // 队首换人，重新计时
  }

  /* ---------- 交互 ---------- */
  function onItemClick(item) {
    clearTimeout(idleTimer);
    toggleDetail(item);
    resumeTimer();
    armIdle();
  }

  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const open = items.find((it) => it.state === 'detail');
      if (open) {                       // 详情卡忘了收：收回并恢复计时
        toggleDetail(open);
        resumeTimer();
      }
    }, IDLE);
  }

  function dismissAll() {
    clearTimeout(frontTimer);
    clearTimeout(idleTimer);
    for (const item of items) {
      item.el.classList.remove('is-shown');
      setTimeout(() => item.el.remove(), 420);
    }
    items.length = 0;
  }

  function push(tier) {
    createItem(tier);
    if (items.length === 1) startFrontTimer();   // 队首才开始计时，后来者候队
    armIdle();
  }

  /* ---------- 控件 ---------- */
  document.querySelectorAll('.chip[data-tier]').forEach((btn) => {
    btn.addEventListener('click', () => push(btn.dataset.tier));
  });
  document.getElementById('btnBurst').addEventListener('click', () => {
    ['normal', 'rare', 'precious', 'hidden'].forEach(push);
  });
  document.getElementById('btnClear').addEventListener('click', dismissAll);
  document.getElementById('btnSpeed').addEventListener('click', (e) => {
    const slow = document.documentElement.style.getPropertyValue('--k') === '1.8';
    document.documentElement.style.setProperty('--k', slow ? '1' : '1.8');
    e.currentTarget.textContent = slow ? '慢放 ×1.8' : '恢复原速';
  });
  window.addEventListener('keydown', (e) => {
    const map = { 1: 'normal', 2: 'rare', 3: 'precious', 4: 'hidden' };
    if (map[e.key]) push(map[e.key]);
  });

  // 点击空白处：收回详情态
  SHELL.addEventListener('click', () => {
    const open = items.find((it) => it.state === 'detail');
    if (open) { toggleDetail(open); resumeTimer(); armIdle(); }
  });

  // 打开即演示：先来一条，方便直接看动效
  push('rare');
})();
</script>
</body>
</html>
