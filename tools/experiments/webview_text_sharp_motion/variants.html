<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>webview_text_sharp_motion variants</title>
<!--
  单页多变体实验页面：URL 参数 ?v=<variant>&dsf=<scale> 决定渲染哪个变体。
  每次截图只呈现一个变体，几何固定（样本块 left:40 top:120，居中块 left:40 top:220），
  分析脚本按固定框裁剪。底部黑色进度条记录文字元素的实际水平位移（CSS px），
  供分析脚本反推设备像素残差——每张截图自带位移真值（身份先于统计量）。

  变体清单与对应的前端实物：
    ref               无变换基线（对照）
    rept_frac         重绘路径：无 will-change 的静态 transform 分数偏移
    comp_frac         合成路径 2D 平移 + 分数设备偏移
    comp_int          合成路径 2D 平移 + 逐帧对齐物理像素（snap 用页面自身 dsf）
    comp_frac_3d      合成路径 3D 平移（translate3d）+ 分数设备偏移（= 数字胶囊现状）
    comp_int_3d       合成路径 3D 平移 + 对齐（= 修复后）
    center_t50        left:50% + translateX(-50%) 居中且常驻合成层（= Toast 居中模式）
    center_auto       margin:auto 布局居中，不进合成层
    center_t50_nowc   transform 居中但无常驻层（分解「LCD 消失」与「分数残差」两因素）
    anim_pause_frac   CSS 动画中间帧：linear 1.6s 在 -0.4s 暂停 → 恰 25% → 7.5px
    anim_pause_scale  CSS scale 动画暂停在 50%（scale(1.03)，modal 进场的动画中间态）
    anim_mid_scale    CSS scale 动画进行中（虚拟时间截停，非稳定态——暂停建模的盲区补测）
    js_mid_wc         JS 逐帧写样式中间帧建模：合成层 + translateX(15.2px)
    js_mid_nowc       JS 逐帧写样式中间帧建模：无常驻层 translateX(15.2px)
    （无头 --headless=new 的虚拟时间不驱动 rAF 逐帧推进，rAF 循环截图只会拿到初始帧，
     故运动中间帧用「同步写一次中间值」建模：合成器对每帧采样当前 transform，
     静止分数偏移与运动中间帧是同一采样路径；CSS 暂停动画变体提供动画机制状态的交叉验证。）
    （追加 &lcd=1：文字与背景改纯灰/纯白——边缘出现 RGB 散布即 LCD 亚像素渲染的物理证据）
-->
<style>
  @keyframes sharp-slide { from { transform: translateX(0); } to { transform: translateX(30px); } }
  @keyframes sharp-zoom { from { transform: scale(1); } to { transform: scale(1.06); } }
  html, body { margin: 0; }
  body {
    background: #FFFFFF; color: #1F2328;
    font-family: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  #sample {
    position: absolute; left: 40px; top: 120px;
    font-size: 18px; font-weight: 600; letter-spacing: -0.03em; line-height: 25px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #centerwrap { position: absolute; left: 40px; top: 220px; width: 202px; height: 28px; }
  #centered {
    display: inline-block; width: 101px; white-space: nowrap;
    font-size: 12px; font-weight: 600; line-height: 28px; text-align: center;
  }
  #bar { position: absolute; left: 40px; top: 172px; height: 4px; width: 0; background: #1F2328; }
  /* ---- 成就卡复刻（判决「逐渐变糊」）：卡座常驻 perspective+translate3d，rave 标题无限双动画 ---- */
  @property --xhue { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .xcard {
    position: absolute; left: 16px; top: 96px; width: 340px; height: 118px;
    padding: 14px 18px; border-radius: 14px;
    border: 1.6px solid transparent;
    background:
      linear-gradient(#FFFFFF, #FFFFFF) padding-box,
      conic-gradient(from var(--xang, 118deg) in oklch longer hue,
        oklch(0.988 0.022 var(--xhue, 0deg)),
        oklch(0.995 0.010 calc(var(--xhue, 0deg) + 72deg)),
        oklch(0.988 0.022 calc(var(--xhue, 0deg) + 144deg)),
        oklch(0.995 0.010 calc(var(--xhue, 0deg) + 216deg)),
        oklch(0.988 0.022 calc(var(--xhue, 0deg) + 288deg)),
        oklch(0.988 0.022 var(--xhue, 0deg))) border-box;
    transform: perspective(800px) translate3d(0, var(--xlift, 0px), 0)
               rotateX(var(--xrx, 0deg)) rotateY(var(--xry, 0deg));
  }
  .xcard .xlabel { font-size: 12px; color: #8a8f98; text-align: center; }
  .xtitle {
    margin-top: 6px; text-align: center;
    font-size: 15px; font-weight: 600; line-height: 1.25; white-space: nowrap;
  }
  .rave {
    --xrl: 0.7; --xrc: 0.16;
    background-image:
      linear-gradient(90deg in oklch longer hue,
        oklch(var(--xrl) var(--xrc) var(--xhue)),
        oklch(var(--xrl) var(--xrc) var(--xhue))),
      linear-gradient(currentColor, currentColor);
    background-size: 100% 100%, 100% 100%;
    background-repeat: no-repeat;
    background-clip: text; -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .rave--anim {
    animation: xscan 6s linear(0, 1 30%, 1 100%) infinite,
               xhuerot 6s linear infinite;
  }
  @keyframes xscan { from { background-position: 100% 0, 0 0; } to { background-position: 0% 0, 0 0; } }
  @keyframes xhuerot { from { --xhue: 0deg; } to { --xhue: 360deg; } }
  #meta { position: absolute; left: 8px; bottom: 6px; font-size: 11px; font-weight: 400; color: #8a8f98; }
</style>
</head>
<body>
<div id="sample">0123456789 任务设置数字胶囊清晰度 0123456789</div>
<div id="xcardwrap" hidden>
  <div class="xcard" id="xcard">
    <div class="xlabel">触发条件</div>
    <div class="xtitle" id="xtit">一分钟内第二次打断倒计时</div>
  </div>
</div>
<div id="centerwrap" hidden><div id="centered">数字胶囊</div></div>
<div id="bar"></div>
<div id="meta"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || 'ref';
  var dsf = parseFloat(q.get('dsf') || '1') || 1;
  var lcd = q.get('lcd') === '1';
  var el = document.getElementById('sample');
  var wrap = document.getElementById('centerwrap');
  var ctr = document.getElementById('centered');
  var bar = document.getElementById('bar');
  var meta = document.getElementById('meta');
  // 逐帧对齐物理像素：snap(cssPx) 的结果乘以 dsf 恒为整数
  var snap = function (cssPx) { return Math.round(cssPx * dsf) / dsf; };
  var setBar = function (textStartCss) { bar.style.width = (textStartCss - 40) + 'px'; };

  if (lcd) el.style.color = '#333333';  // 纯灰文字/纯白底：文本色本身 RGB 相等，边缘彩色散布只能来自 LCD AA

  switch (v) {
    case 'ref':
      setBar(40);
      break;
    case 'rept_frac':          // 重绘路径：非合成元素的静态 transform
      el.style.transform = 'translateX(30px)';
      setBar(70);
      break;
    case 'comp_frac':          // 合成路径：常驻层 + 分数设备偏移（2D 平移）
      el.style.willChange = 'transform';
      el.style.transform = 'translateX(30px)';
      setBar(70);
      break;
    case 'comp_int':           // 合成路径 + 位移对齐物理像素（2D）
      el.style.willChange = 'transform';
      el.style.transform = 'translateX(' + snap(30) + 'px)';
      setBar(40 + snap(30));
      break;
    case 'comp_frac_3d':       // 合成路径 + 3D 平移（= 数字胶囊 translate3d 现状）
      el.style.willChange = 'transform';
      el.style.transform = 'translate3d(30px, 0, 0)';
      setBar(70);
      break;
    case 'comp_int_3d':        // 合成路径 + 3D 平移 + 对齐
      el.style.willChange = 'transform';
      el.style.transform = 'translate3d(' + snap(30) + 'px, 0, 0)';
      setBar(40 + snap(30));
      break;
    case 'center_t50':         // transform 居中且常驻合成层（Toast 模式）
      wrap.hidden = false; el.style.display = 'none';
      ctr.style.position = 'absolute'; ctr.style.left = '50%';
      ctr.style.willChange = 'transform';
      ctr.style.transform = 'translateX(-50%)';
      setBar(90.5);            // wrap 202 宽 - 子块 101 宽 → 中心落在 .5 上
      break;
    case 'center_auto':        // 布局居中：不进合成层
      wrap.hidden = false; el.style.display = 'none';
      ctr.style.position = 'relative'; ctr.style.margin = '0 auto';
      setBar(90.5);
      break;
    case 'rept_scale':         // 重绘路径 scale：非合成元素的静态缩放
      el.style.transform = 'scale(1.03)';
      setBar(40);
      break;
    case 'comp_scale':         // 合成路径 scale（= modal 进场 scale(1.06→1) 的中间态）
      el.style.willChange = 'transform';
      el.style.transform = 'scale(1.03)';
      setBar(40);
      break;
    case 'comp_opacity':       // 合成路径 opacity：不改几何（fade 类动画的安全性）
      el.style.willChange = 'opacity';
      el.style.opacity = '0.999';
      setBar(40);
      break;
    case 'center_t50_nowc':    // transform 居中但无常驻层（重绘路径，分解 LCD 与残差两因素）
      wrap.hidden = false; el.style.display = 'none';
      ctr.style.position = 'absolute'; ctr.style.left = '50%';
      ctr.style.transform = 'translateX(-50%)';
      setBar(90.5);
      break;
    case 'anim_pause_frac':    // CSS 动画中间帧：-0.4s 暂停在恰 25% 处（7.5px）
      el.style.willChange = 'transform';
      el.style.animation = 'sharp-slide 1.6s linear -0.4s paused';
      setBar(47.5);
      break;
    case 'card_static':        // 卡复刻静置：perspective 卡座 + 纯文字标题（无动画）
    case 'card_rave':          // 卡复刻 + rave 标题（无限 scan+hue），fresh
    case 'card_rave_20s':      // 同上，20s 虚拟时间后截（提层是否随时间退化）
    case 'card_rave_flip':     // 翻卡复刻：卡座 rotateY(180°) + rave 标题持续重绘，fresh
    case 'card_rave_flip_6k':  // 同上，6.4s 同相位后截
    case 'card_rave_t1':       // 同相位相位对齐组：6.4s（= 400ms + 1 周期）
    case 'card_rave_t2':       // 12.4s
    case 'card_rave_t3':       // 18.4s
    case 'rave_only':          // 裸 rave 标题（无卡座），fresh
    case 'rave_only_20s':      // 裸 rave 标题，20s 后截
      {
        document.getElementById('xcardwrap').hidden = false;
        el.style.display = 'none';
        bar.style.display = 'none';
        var xcard = document.getElementById('xcard');
        var xtit = document.getElementById('xtit');
        var carded = v.indexOf('card_') === 0;
        xcard.style.display = carded ? 'block' : 'none';
        var animated = (v.indexOf('card_rave') === 0 || v === 'rave_only' || v === 'rave_only_20s');
        if (animated) xtit.classList.add('rave', 'rave--anim');
        if (v.indexOf('card_rave_flip') === 0)
          xcard.style.transform = 'perspective(800px) rotateY(180deg)';
        if (!carded) {
          document.body.appendChild(xtit);   // 脱离 display:none 的卡座才能独立呈现
          xtit.style.position = 'absolute'; xtit.style.left = '40px'; xtit.style.top = '110px';
          xtit.style.fontSize = '18px';
        }
      }
      break;
    case 'anim_mid_scale':     // CSS scale 动画进行中（虚拟时间截停在 75% 处，非稳定态）
      el.style.willChange = 'transform';
      el.style.animation = 'sharp-zoom 1.6s linear -0.8s running';
      setBar(40);
      break;
    case 'js_mid_wc':          // JS 逐帧写样式的中间帧建模：合成层 + 分数偏移
      el.style.willChange = 'transform';
      el.style.transform = 'translateX(15.2px)';
      setBar(55.2);
      break;
    case 'js_mid_nowc':        // JS 逐帧写样式的中间帧建模：无常驻层（重绘路径）
      el.style.transform = 'translateX(15.2px)';
      setBar(55.2);
      break;
    case 'anim_pause_scale':   // CSS scale 动画暂停在 50%（= modal 进场 scale 的动画中间态）
      el.style.willChange = 'transform';
      el.style.animation = 'sharp-zoom 1.6s linear -0.8s paused';
      setBar(40);
      break;
    default:
      meta.textContent = 'UNKNOWN VARIANT ' + v;
      return;
  }
  meta.textContent = 'variant=' + v + ' dsf=' + dsf + (lcd ? ' lcd=1' : '');
})();
</script>
</body>
</html>
