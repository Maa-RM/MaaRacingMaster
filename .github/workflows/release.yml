# =============================================================================
# Release CI/CD — 推送 Git Tag 时自动创建 GitHub Release
# Tag 版本号遵循 SemVer 2.0.0 规范（X.Y.Z），tag 格式 vX.Y.Z
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 发布前置门禁：直接复用 test.yml（workflow_call），与 PR 跑同一套守卫。
  # 不另抄一份 step 清单——历史上这份只跑 truth + pytest，ruff / pyright / 卫生检查 /
  # 体积守卫 / Shell 编译全缺，依赖版本还各写一遍；再抄一份只会继续分叉。
  gate:
    name: 发布前门禁（复用 test.yml）
    uses: ./.github/workflows/test.yml

  release:
    name: 创建 Release（草稿）
    runs-on: ubuntu-latest
    needs: gate  # 门禁通过后才会执行发布
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # 完整历史：setuptools-scm 版本推导 + changelog 兜底信源（git log）

      - name: 设置 Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: 提取版本号
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 校验 SemVer 格式
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "校验版本号: $VERSION"
          if ! echo "$VERSION" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "❌ 版本号 '$VERSION' 不符合 SemVer 2.0.0 规范！"
            echo "正确格式: X.Y.Z 或 X.Y.Z-pre.id+build"
            exit 1
          fi
          echo "✅ SemVer 格式校验通过"

      - name: 安装依赖
        # 本 job 持 contents: write，裸包名等于每次发布都把 PyPI 当前版本重新解析一遍——
        # 版本漂移就是供应链口子。钉当前版本 = 冻结今天的行为；升级必须是显式改动。
        run: |
          pip install "build==1.6.1" "setuptools-scm==10.3.4" "packaging==26.3"

      - name: 验证包构建
        run: |
          # 验证 setuptools-scm 能从当前 tag 正确读取版本
          # 注意：setuptools-scm 输出 PEP 440 格式（如 0.13.0.dev3），tag 是 SemVer 格式（如 0.13.0-dev.3）
          # 两者语义等价，但字符串不同，所以用 packaging.version 做版本比较而非字符串全等
          python -c "
          from setuptools_scm import get_version
          from packaging.version import Version
          v = get_version(root='.')
          tag_v = '${{ steps.version.outputs.version }}'
          print(f'setuptools-scm 解析版本（PEP 440）: {v}')
          print(f'tag 原始版本（SemVer）:       {tag_v}')
          assert Version(v) == Version(tag_v), f'版本语义不一致: setuptools-scm={v}, tag={tag_v}'
          print('✅ 版本语义一致性验证通过')
          "

      - name: 生成 Changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 对外叙事信源为人工撰写的 docs/update_log.md 对应版本小节；git DAG 是
          # 内部施工日志（含 M1/G2/V-1 等里程碑编号），不作为面向玩家的变更记录。
          # 仅当日志尚未补写该小节时回退 git log 兜底，并打 warning 提示补写。
          LOG=$(python scripts/release/extract_changelog.py "$VERSION")
          if [ -z "$LOG" ]; then
            echo "::warning::docs/update_log.md 缺 v${VERSION} 小节，Release 正文回退 git log，请补写日志"
            # 取「除当前 tag 外」的最新一个作为 PREV_TAG：单 tag 场景下 head -n 2|tail -n 1 会误取当前 tag
            # 自身导致范围为空 → 用 grep -v 排除当前 tag，若为空则回退列出最近 50 条提交
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -n 1 || echo "")
            if [ -n "$PREV_TAG" ]; then
              LOG=$(git log --oneline --no-decorate "$PREV_TAG".."${{ steps.version.outputs.tag }}" 2>/dev/null | head -50)
            else
              LOG=$(git log --oneline --no-decorate --max-count=50 2>/dev/null)
            fi
          fi
          # 多行写入 GITHUB_OUTPUT；分隔符用 CHANGELOG_EOF，避免正文出现裸 EOF 行时截断
          {
            echo "log<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建分发包
        run: |
          # 产物不再上传（Release 只挂 win 包与模型包，见 win-build / cnb-release）；
          # 本步保留作打包配置的发布前验证：sdist/wheel 能否从 tag 正确构建。
          # python -m build 默认在隔离 venv 中构建：setuptools-scm 在隔离环境 git 探测失败（listing git files failed）
          # 且 SETUPTOOLS_SCM_PRETEND_VERSION 实测未生效，sdist/wheel 版本号仍回退 0.0.0。
          # 改用 --no-isolation 在当前环境构建：setuptools-scm 直接读 git tag（「验证包构建」步骤已证明可行），
          # PRETEND_VERSION 保留作兜底。注意其需 PEP 440 格式（0.15.0.dev8），tag 是 SemVer 格式（0.15.0-dev.8）。
          PRETEND=$(python -c "from packaging.version import Version; print(str(Version('${{ steps.version.outputs.version }}')))")
          echo "PRETEND_VERSION=$PRETEND"
          SETUPTOOLS_SCM_PRETEND_VERSION="$PRETEND" python -m build --no-isolation

      - name: 创建 GitHub Release（草稿）
        # 先建草稿：资产未上传前页面不可见，构建失败只留草稿不留「没有下载包的发布页」。
        # 公开动作在 win-build 的资产上传完成后自动完成（见下方「公开校验」）。
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## v${{ steps.version.outputs.version }}

            ### 变更记录
            ${{ steps.changelog.outputs.log }}

            ---
            > **下载哪个文件**：普通用户只需下载 `MaaRacingMaster-${{ steps.version.outputs.version }}-win-x64.zip`，解压即用。
            > 版本号遵循 [SemVer 2.0.0](https://semver.org/lang/zh-CN/) 规范
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      # 版本标记文件（docs/latest_release.json）不由 CI 回写：master 受分支保护
      # （PR + status checks），GITHUB_TOKEN 直推必 409。改由发版提交预先携带更新
      # 后的标记文件（与 tag 同 commit，mirror-to-cnb.yml 随 git 镜像同步到 CNB；
      # 程序「检测更新」从 CNB raw 优先读取，GitHub raw 与 GitHub API 兜底）。

  # 解压即用的 Windows 可执行包：embedded Python3.11 runtime + 预装依赖 + dotnet publish GUI，
  # 组装成 MaaRacingMaster-<ver>-win-x64.zip 并补传同一 Release（见 scripts/release/assemble.ps1）。
  # 在 release job 之后顺序执行，避免与「创建 Release」竞态。
  #
  # 【发行链现状，勿误判】本 job 走 legacy ZIP（-Managed 未启用），随包不含 update-source.txt，
  # 因此正式发行包里的自动升级诚实降级为手动入口。受管内容树（assemble -Managed）、
  # vpk --channel stable/preview 分渠道打包与两套索引的产出脚本虽已就绪，但尚未接入 CI：
  # 真实 feed 地址、上传与产物公开时机属 P4 未验收项，需发布授权后单独接线。
  # 脚本具备能力 != 该能力已上线；接线前要先定真实 feed 地址与产物公开时机。
  win-build:
    name: 构建解压即用 Windows 包
    runs-on: windows-latest
    needs: release  # 等草稿先建，再向其补传 zip 与模型包（传完才公开）
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # 完整历史（版本/README 语义）；模型非 LFS，快照自带
          lfs: true       # 防患：仓库将来若接 LFS 模型，避免打到指针文件

      - name: 设置 Python 3.11（装 runtime 依赖，必须 cp311 以匹配 embedded）
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'  # 缓存 pip 下载缓存，作为 runtime-cache 之外的第二层兜底

      - name: 设置 .NET SDK（编译 WinUI GUI）
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: 设置 MSVC（编译 native Launcher）
        uses: mlocati/setup-msvc@1.3.1
        with:
          architecture: x64
          vs-version: latest

      - name: 缓存 NuGet 包（Microsoft.WindowsAppSDK 等，避免每次重下）
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/MaaRacingMaster.Shell/MaaRacingMaster.Shell.csproj', 'apps/MaaRacingMaster.Shell/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 缓存 runtime 依赖（embedded Python + pip 包，避免每次重下几百MB）
        uses: actions/cache@v6.1.0
        with:
          path: build/runtime-cache
          key: ${{ runner.os }}-rtcache-${{ hashFiles('scripts/release/requirements-runtime-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-rtcache-

      - name: 提取版本号
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          "VER=$ver" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "TAGNAME=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: 网络连通性自检（多源/镜像，提前暴露网络问题）
        shell: pwsh
        run: |
          $urls = 'https://pypi.org/simple/','https://files.pythonhosted.org/','https://pypi.tuna.tsinghua.edu.cn/simple/','https://mirrors.aliyun.com/pypi/simple/'
          foreach ($u in $urls) {
            try {
              $r = Invoke-WebRequest -Uri $u -Method Head -TimeoutSec 15 -UseBasicParsing
              Write-Host "OK  $u  $($r.StatusCode)"
            } catch {
              Write-Host "ERR $u  $($_.Exception.Message)"
            }
          }

      - name: 验证打包筛选与失败阻断
        shell: pwsh
        run: |
          # pytest 版本只在 requirements-ci.txt 一处，这里读出来用，不写第三个副本
          $pin = (Select-String -Path requirements-ci.txt -Pattern '^pytest==').Line
          if (-not $pin) { throw "requirements-ci.txt 缺 pytest 钉版本" }
          python -m pip install $pin
          python -B -m pytest tests/test_release_assembly.py tests/test_release_ship_expiry.py -q

      - name: 生成可选模型包与下载描述（车道线与物品感知）
        shell: pwsh
        run: |
          # 先出模型 ZIP 与 download.json，再把描述注入主包——主包与模型资产同 tag 同源。
          python scripts/release/make_model_pack.py `
            --version "$env:VER" `
            --out "${{ github.workspace }}\build\release" `
            --github-repo "${{ github.repository }}" `
            --cnb-path "${{ secrets.CNB_ORG }}/${{ secrets.CNB_REPO }}"
          $mp = "${{ github.workspace }}\build\release\MaaRacingMaster-infinite_drive-models-$env:VER.zip"
          $desc = "${{ github.workspace }}\build\release\model-download.json"
          if (-not (Test-Path $mp)) { throw "模型包未生成: $mp" }
          if (-not (Test-Path $desc)) { throw "下载描述未生成: $desc" }
          Get-Item $mp, "$mp.sha256", $desc | Select-Object Name, Length

      - name: 组装解压即用包（runtime + publish + 白名单 + 自检 + zip + sha256）
        shell: pwsh
        run: |
          # native Launcher 编译：前面「设置 MSVC」已把 cl.exe 放入 PATH，assemble 直接使用；
          # 若 cl 不在 PATH，assemble 内部会自动探测 vcvarsall.bat。
          & "${{ github.workspace }}\scripts\release\assemble.ps1" `
            -Version "$env:VER" `
            -RepoRoot "${{ github.workspace }}" `
            -OutRoot "${{ github.workspace }}\build\release" `
            -ModelDescriptor "${{ github.workspace }}\build\release\model-download.json"

      - name: 校验产物存在
        shell: pwsh
        run: |
          $zip = "${{ github.workspace }}\build\release\MaaRacingMaster-$env:VER-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "zip 未生成: $zip" }
          Get-Item $zip | Select-Object Name, Length

      - name: 同 tag 资产不可变检查（GitHub）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 草稿不进 /releases/tags（那里 404），按列表查回来：同一 token 能看到自己的草稿。
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $rel = $rels | Where-Object { $_.tag_name -eq $env:TAGNAME } | Select-Object -First 1
          if (-not $rel) { throw "找不到本 tag 的 Release（草稿或已发布）: $env:TAGNAME" }
          $names = @(
            "MaaRacingMaster-$env:VER-win-x64.zip",
            "MaaRacingMaster-infinite_drive-models-$env:VER.zip"
          )
          foreach ($name in $names) {
            $asset = $rel.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset -or -not $asset.digest) { continue }
            $sumFile = "${{ github.workspace }}\build\release\$name.sha256"
            $local = (Get-Content $sumFile -Raw).Split(' ')[0]
            if ($asset.digest -ne "sha256:$local") {
              throw "同 tag 资产 $name 已存在且内容不同，拒绝覆盖（旧程序内置哈希会失效）"
            }
            Write-Host "同 tag 资产 $name 已存在且哈希一致，复用"
          }

      - name: 补传 zip + 模型包到 Release
        # 故意不传 draft：上传完两个资产后，action 把草稿转为公开（finalize）——
        # 这是「页面公开时下载包已就位」的唯一保证点。改回 draft: true 会把草稿永久留在不可见状态。
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.TAGNAME }}
          overwrite: false
          files: |
            ${{ github.workspace }}/build/release/MaaRacingMaster-${{ env.VER }}-win-x64.zip
            ${{ github.workspace }}/build/release/MaaRacingMaster-infinite_drive-models-${{ env.VER }}.zip

      - name: 公开校验（已公开且资产齐全）
        # 把「公开时下载包已就位」变成可机检的结论：仍为草稿或缺任一资产即失败。
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api "repos/${{ github.repository }}/releases/tags/$env:TAGNAME" | ConvertFrom-Json
          if ($rel.draft) { throw "Release 仍是草稿: $env:TAGNAME" }
          foreach ($name in @(
            "MaaRacingMaster-$env:VER-win-x64.zip",
            "MaaRacingMaster-infinite_drive-models-$env:VER.zip"
          )) {
            if (-not ($rel.assets | Where-Object { $_.name -eq $name })) {
              throw "公开后缺资产: $name"
            }
          }
          Write-Host "Release 已公开，主包与模型包均在位: $env:TAGNAME"

  # CNB（cnb.cool）Release 资产同步：把 GitHub Release 的 zip 与模型包推到 CNB 仓库的
  # 同名 Release，并同步 Release 正文（下载指引，CNB 页面不再空白）。
  # CNB 构建节点只有 Linux 容器（无 Windows），无法自行构建本项目发布包，
  # 故由 GitHub（唯一信源）构建后经 CNB OpenAPI 分发——国内用户从 CNB 下载（快），
  # 开发流程完全不受影响（CNB 无 .cnb.yml，零流水线零污染）。
  # 独立 .sha256 文件不再分发：两平台资产行均原生展示 sha256，校验码不再另行承载；
  # 模型包一键安装的校验走主包内置 download.json。
  # 下载直链形如 https://cnb.cool/<org>/<repo>/-/releases/download/<tag>/<file>
  cnb-release:
    name: 同步 Release 资产到 CNB
    runs-on: ubuntu-latest
    needs: win-build  # 等 zip 补传到 GitHub Release 完成后再同步
    # 纯脚本任务：下载走公开 URL、上传走 CNB OpenAPI（CNB_TOKEN secret），
    # 全程不使用 GITHUB_TOKEN，权限收到零。
    permissions: {}
    steps:
      - name: 同步 zip、模型包与正文到 CNB Release
        # CNB 仓库路径与 mirror-to-cnb.yml 同源读 secrets，避免同一事实两处硬编码
        # （改名时只改 secrets 会漏掉本 job，资产同步静默失效）。
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_PATH: ${{ secrets.CNB_ORG }}/${{ secrets.CNB_REPO }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.cnb.cool/${CNB_PATH}"
          AUTH="Authorization: Bearer ${CNB_TOKEN}"
          VER="${TAG#v}"
          ZIP="MaaRacingMaster-${VER}-win-x64.zip"
          MODELS="MaaRacingMaster-infinite_drive-models-${VER}.zip"

          # 1) 从 GitHub Release 下载本 tag 的资产（win-build 已补传完成）
          for f in "$ZIP" "$MODELS"; do
            curl -fsSL --retry 3 -o "$f" \
              "https://github.com/${GH_REPO}/releases/download/${TAG}/${f}"
          done
          ls -lh "$ZIP" "$MODELS"

          # 2) 正文取 GitHub Release（含下载指引）；GitHub 匿名 API 拉不到时
          #    回退本地生成的最小指引。
          GH_BODY=$(curl -fsSL --retry 2 \
            "https://api.github.com/repos/${GH_REPO}/releases/tags/${TAG}" \
            | jq -r '.body // empty') || GH_BODY=""
          if [ -z "${GH_BODY}" ]; then
            GH_BODY="> **下载哪个文件**：普通用户只需下载 \`${ZIP}\`，解压即用。"
          fi

          # 3) 确保 CNB 上存在同名 Release（镜像只同步 git refs，不同步 Release 元数据）
          # CNB API 的 GET 必须带 Accept: application/json，缺失返回 406（实测）
          code=$(curl -s -o /tmp/rel.json -w '%{http_code}' -H "$AUTH" \
            -H 'Accept: application/json' \
            "${API}/-/releases/tags/${TAG}")
          if [ "$code" = "404" ]; then
            if echo "$TAG" | grep -q -- '-'; then PRE=true; else PRE=false; fi
            body=$(jq -n --arg tag "$TAG" --arg name "$TAG" --argjson pre "$PRE" \
              --arg body "${GH_BODY}" \
              '{tag_name:$tag, name:$name, prerelease:$pre, draft:false, make_latest:"true", body:$body}')
            code=$(curl -s -o /tmp/rel.json -w '%{http_code}' -X POST -H "$AUTH" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' -d "$body" "${API}/-/releases")
            if [ "$code" != "201" ]; then
              echo "创建 CNB Release 失败 HTTP=$code"; cat /tmp/rel.json; exit 1
            fi
          elif [ "$code" = "200" ]; then
            # 已有 Release：把正文刷成与 GitHub 一致（幂等，重跑结果相同）
            patch_body=$(jq -n --arg body "${GH_BODY}" '{body:$body}')
            code=$(curl -s -o /tmp/rel.json -w '%{http_code}' -X PATCH -H "$AUTH" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' -d "$patch_body" \
              "${API}/-/releases/$(jq -r '.id' /tmp/rel.json)")
            if [ "$code" != "200" ]; then
              echo "更新 CNB Release 正文失败 HTTP=$code"; cat /tmp/rel.json; exit 1
            fi
          else
            echo "查询 CNB Release 失败 HTTP=$code"; cat /tmp/rel.json; exit 1
          fi
          RID=$(jq -r '.id' /tmp/rel.json)
          echo "CNB release id=$RID (tag=$TAG)"

          # 4) 三步上传资产：申请预签名 URL → PUT 文件 → POST 确认。
          # 同 tag 同名资产若已存在：哈希一致则复用，哈希不同则阻断——旧程序内置的
          # ZIP 哈希必须与线上资产一一对应，重跑发布不得悄悄换字节。
          upload_asset() {
            local f="$1"
            local name; name=$(basename "$f")
            local url="https://cnb.cool/${CNB_PATH}/-/releases/download/${TAG}/${name}"
            local existing; existing=$(mktemp)
            if curl -fsSL -o "$existing" "$url" 2>/dev/null; then
              local want have
              want=$(sha256sum "$f" | cut -d' ' -f1)
              have=$(sha256sum "$existing" | cut -d' ' -f1)
              rm -f "$existing"
              if [ "$want" != "$have" ]; then
                echo "同 tag 资产 $name 已存在且内容不同，拒绝覆盖"; exit 1
              fi
              echo "同 tag 资产 $name 已存在且哈希一致，复用"
              return 0
            fi
            rm -f "$existing"
            local size; size=$(stat -c%s "$f")
            local resp; resp=$(curl -fsSL -X POST -H "$AUTH" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d "{\"asset_name\":\"${name}\",\"size\":${size},\"overwrite\":false}" \
              "${API}/-/releases/${RID}/asset-upload-url")
            local up_url verify_url
            up_url=$(echo "$resp" | jq -r '.upload_url')
            verify_url=$(echo "$resp" | jq -r '.verify_url')
            curl -fsSL --retry 2 -X PUT --upload-file "$f" "$up_url"
            # verify 端点同样要求 Accept: application/json（缺失 406，实测）
            curl -fsSL -X POST -H "$AUTH" -H 'Accept: application/json' "$verify_url"
            echo "已上传 $(basename "$f") ($size bytes)"
          }
          upload_asset "$ZIP"
          upload_asset "$MODELS"
          echo "CNB Release 同步完成: https://cnb.cool/${CNB_PATH}/-/releases"

