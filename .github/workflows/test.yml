# =============================================================================
# CI 自动化单测 — PR 时运行；master 与 release/** 的直接推送也触发，普通分支推送不触发。
# 同一个文件以 workflow_call 被 release.yml 复用为发布前门禁：发布与 PR 跑同一套守卫。
# （历史缺口：发布前那份 test job 只跑 truth + pytest，缺 ruff / pyright / 卫生检查 /
#   体积守卫 / Shell 编译，依赖版本还各写一遍。）
# 两个 job，分别覆盖两侧语言：
#   test（ubuntu）         Python 侧：体积守卫 / 真源机检 / 卫生检查 / ruff / pyright / pytest。
#   shell-build（windows） C# 侧：dotnet build。Python 门禁覆盖不到 C# 编译错误。
#
# 【改名警告】job id、test 的 name 与 matrix 值共同决定 master 的必需状态检查
#   "单元测试 (pytest) (3.11)"（protected=true，enforcement_level=non_admins，
#   ruleset stable-master-pr-only）。改任一项都会换掉上报的检查名，
#   非管理员随即无法合并——要改先同步远端规则集，别在本地单方面改。
# =============================================================================
name: Test

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
  # 供 release.yml 复用（发布门禁）。调用方 job 的 name 会带前缀，但那只影响 tag 流水线，
  # PR 上的检查名仍由下面的 pull_request 触发直接上报，保持不变。
  workflow_call:

jobs:
  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 仓库体积守卫（跟踪文件不得超过 5 MB）
        # 机制：git 历史只增不减——误提交的大文件永久留在 pack 里，并随每一次
        # clone / 每一次 CNB 镜像分发。项目规范禁止改写已推送历史，故无法事后补救，
        # 唯一防线是在首次合入前拦住。阈值 5 MB 远低于 GitHub 的 100 MB 硬拒线，
        # 留出余量给后续版本的增量 blob。
        # 例外：resources/models/** 下的运行时模型是随包分发的既定产品资产
        # （见 maaracing_master/plugins/infinite_drive/resources/models/README.md），
        # 单文件上限放宽到 100 MB；归档插件保留自己的模型资产，同一份模型在不同
        # 插件目录下是同一个 blob，不额外增加仓库体积。其余路径仍按 5 MB 拦截。
        # 口径用 git ls-tree -l 的对象大小：文本按 .gitattributes 归一（LF）后的
        # 实际入库体积计，不受 runner 上 core.autocrlf 影响。
        run: |
          LIMIT=$((5 * 1024 * 1024))
          MODEL_LIMIT=$((100 * 1024 * 1024))
          git ls-tree -r -l HEAD \
            | awk -v max="$LIMIT" -v mmax="$MODEL_LIMIT" '
                $4 ~ /^[0-9]+$/ {
                  model = ($NF ~ /^maaracing_master\/plugins\/(_archive\/)?[^/]+\/resources\/models\/.*\.onnx$/)
                  limit = model ? mmax : max
                  if ($4 + 0 > limit) printf "%12d  %s\n", $4, $NF
                }' \
            > big-files.txt
          if [ -s big-files.txt ]; then
            echo "::error::以下跟踪文件超过体积上限（普通文件 5 MB / 运行时模型 100 MB），请改为忽略（用生成脚本 + 锁文件重建）、或走 Git LFS / Release 附件承载："
            cat big-files.txt
            exit 1
          fi
          COUNT=$(git ls-files | wc -l)
          echo "✓ ${COUNT} 个跟踪文件均在体积上限内"

      - name: 设置 Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 校验节点真源自洽（图闭合 + 几何 + 分层红线）
        # truth 为纯标准库工具，本步骤零依赖直接运行。
        # 资源读取路径由 truth 自身扫 plugins/ 顶层插件承担：路径断裂即本步红。
        # 归档区（plugins/_archive）不注册、不列出；其鉴宝套件自声明 retired，本门禁不跑
        # （需要时显式执行：pytest <归档目录> -m retired）。
        run: python tools/pipeline/truth.py

      - name: 仓库卫生检查（实验/计划生命周期契约，AGENTS 红线 6）
        # 棘轮语义：存量违规在基线豁免，新增违规即红；基线只减不增。纯标准库，零依赖。
        run: python tools/check_repo_hygiene.py

      - name: 安装测试与静态检查依赖
        # 版本不在本文件出现：测试依赖在 requirements-ci.txt（其 -c 再引发布锁文件），
        # ruff / pyright 在 pyproject.toml 的 dev-lint extra。任何一处再抄版本号
        # 都会变成第二份真相，改版本只改那两处。
        # 不 `--upgrade pip`：那也是每次重新解析的漂移面，runner 自带 pip 足够新。
        run: |
          pip install -r requirements-ci.txt
          python -c "import pathlib,tomllib;d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'));print(chr(10).join(d['project']['optional-dependencies']['dev-lint']))" > /tmp/lint-req.txt
          pip install -r /tmp/lint-req.txt

      - name: 静态检查（ruff：错误级 + Pyflakes）
        # 规则集与存量清零口径见 pyproject.toml [tool.ruff]——E4/E7/E9/F 全仓 0 违规，
        # 新增违规即 CI 红。格式类规则（ruff format）不在门禁内：存量代码无统一格式
        # 约定，一次性重排会淹没 review 信号；要引入时单独决策。
        run: ruff check .

      - name: 类型检查（pyright basic，主包）
        # pyrightconfig.json 为唯一配置源（含 pythonPlatform=Windows：本项目的
        # ctypes.windll / WINFUNCTYPE 是 Windows-only，不声明会在 Linux runner 上
        # 凭空报 51 个 reportAttributeAccessIssue）。依赖只装轻量集，maa /
        # windows-capture 等 Windows-only 包缺失时按 reportMissingImports=warning
        # 降级，不阻塞。treasure 域冻结豁免声明在 module.py/detector.py 文件头。
        run: pyright maaracing_master

      - name: 运行单元测试
        # 不在命令行点名目录：用例发现统一走项目测试配置的 testpaths（根测试 +
        # 无限驾驶插件测试），与发布 gate 同一口径——点名根目录会静默漏掉
        # 配置里的另一处。
        run: python -m pytest -v

  # ---------------------------------------------------------------------------
  # Shell 编译：Python 侧门禁覆盖不到 C#。漏 using、类型名拼错、改了签名没改调用，
  # 都不会被 pytest / ruff / pyright 发现；而本地 dev-shell 只在「源文件比 exe 新」时
  # 才真编译，缺陷可以潜伏很久——实例：RpcBridge.cs 缺 using System.Collections.Generic，
  # 自 37ffec0 潜伏到首次真编译才炸（连带 XamlCompiler 报 WMC9999 次生错误）。
  # 故单列一个 Windows job 做一次真编译；ubuntu runner 上无法完成此步。
  # ---------------------------------------------------------------------------
  shell-build:
    name: Shell 编译 (dotnet build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: 缓存 NuGet 包
        # Windows App SDK 等包较大，冷启动还原占这一步的大头
        uses: actions/cache@v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/**/*.csproj', 'apps/**/NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 编译 Shell（含 XAML 生成）
        # 与 scripts/dev/run.ps1 同一条命令，避免"本地能编、CI 编不过"的口径分裂
        run: dotnet build apps/MaaRacingMaster.Shell/MaaRacingMaster.Shell.csproj -c Debug --nologo -v minimal
