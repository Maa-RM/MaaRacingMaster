# =============================================================================
# 手动打包验证 — 只产出 zip/模型包 artifact，不创建 Release、不打 tag、不推 CNB
# 触发：push 到任意 *-pkgtest 后缀的分支（命名如 chore/<slug>-pkgtest），或手动 workflow_dispatch
# 用途：在没有本机 MSVC 的环境里，用云端 Windows runner 验证 assemble.ps1 全链路
# =============================================================================
name: Package Test

on:
  push:
    branches:
      # 分支命名规范为 <type>/<slug>，故用后缀匹配；写成 dev/**-pkgtest 会在改用 feat/fix/chore 前缀后失效
      - '**/*-pkgtest'
  workflow_dispatch:

jobs:
  package:
    name: 云端打包验证（不发布）
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: 读取版本标记
        # 版本号只有 docs/latest_release.json 一份真源，避免 workflow 里的副本随发版过期
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content "${{ github.workspace }}\docs\latest_release.json" -Raw | ConvertFrom-Json).version
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[\w.]+)?$') { throw "版本标记不合法: $ver" }
          "VER=$ver" >> $env:GITHUB_ENV
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "验证版本: $ver"

      - name: 设置 Python 3.11
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'

      # 不要删本步：windows-2022 runner 自带 VS Build Tools，但 cl.exe 不在 PATH、
      # 也没导出 vcvarsall.bat。实测删掉它之后 assemble.ps1 直接报「未找到 MSVC」并以
      # 「Launcher 未生成」失败（PRUNING-REGRESSION: required 'MaaRacingMaster.exe' missing）。
      - name: 设置 MSVC（编译 native Launcher）
        uses: mlocati/setup-msvc@1.3.1
        with:
          architecture: x64
          vs-version: latest

      - name: 缓存 NuGet 包
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/MaaRacingMaster.Shell/MaaRacingMaster.Shell.csproj', 'apps/MaaRacingMaster.Shell/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 缓存 runtime 依赖
        uses: actions/cache@v6.1.0
        with:
          path: build/runtime-cache
          key: ${{ runner.os }}-rtcache-${{ hashFiles('scripts/release/requirements-runtime-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-rtcache-

      - name: 验证打包筛选与失败阻断
        shell: pwsh
        run: |
          # pytest 版本只在 requirements-ci.txt 一处，这里读出来用，不写第三个副本
          $pin = (Select-String -Path requirements-ci.txt -Pattern '^pytest==').Line
          if (-not $pin) { throw "requirements-ci.txt 缺 pytest 钉版本" }
          python -m pip install $pin
          python -B -m pytest tests/test_release_assembly.py tests/test_release_ship_expiry.py -q

      - name: 生成可选模型包与下载描述
        # 与正式发布同序：先出模型 ZIP 与 download.json，再把描述注入主包。
        # 主包缺描述时「一键安装模型」整条链路失效，演练必须覆盖这一步。
        shell: pwsh
        run: |
          python scripts/release/make_model_pack.py `
            --version "$env:VER" `
            --out "${{ github.workspace }}\build\release" `
            --github-repo "${{ github.repository }}"
          $mp = "${{ github.workspace }}\build\release\MaaRacingMaster-infinite_drive-models-$env:VER.zip"
          $desc = "${{ github.workspace }}\build\release\model-download.json"
          if (-not (Test-Path $mp)) { throw "模型包未生成: $mp" }
          if (-not (Test-Path $desc)) { throw "下载描述未生成: $desc" }
          Get-Item $mp, "$mp.sha256", $desc | Select-Object Name, Length

      - name: 组装解压即用包
        shell: pwsh
        run: |
          & "${{ github.workspace }}\scripts\release\assemble.ps1" `
            -Version "$env:VER" `
            -RepoRoot "${{ github.workspace }}" `
            -OutRoot "${{ github.workspace }}\build\release" `
            -ModelDescriptor "${{ github.workspace }}\build\release\model-download.json"

      - name: 校验产物（含一键安装描述入包）
        shell: pwsh
        run: |
          $zip = "${{ github.workspace }}\build\release\MaaRacingMaster-$env:VER-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "zip 未生成: $zip" }
          Get-Item $zip | Select-Object Name, Length
          $member = 'program/maaracing_master/plugins/infinite_drive/resources/models/download.json'
          # tar 归档成员带 ./ 前缀（Windows bsdtar 实测），比较前先归一
          python -c "import sys, zipfile; names = {n[2:] if n.startswith('./') else n for n in zipfile.ZipFile(sys.argv[1]).namelist()}; sys.exit(0 if sys.argv[2] in names else '缺少 ' + sys.argv[2])" $zip $member
          if ($LASTEXITCODE -ne 0) { throw "主包缺少模型下载描述，一键安装不可用" }
          Write-Host "已确认包内存在 $member"

      - name: 更新清单与增量演练（含反向自验）
        # 非发版演练：用真实打包树生成清单，再合成一份“旧版”让差分真正跑一遍
        # 生成 → 应用 → 逐文件对拍；产物留在 build/drill，不上传、不建 Release。
        shell: pwsh
        run: |
          $rel = "${{ github.workspace }}\build\release"
          $stage = "$rel\MaaRacingMaster-$env:VER-win-x64"
          $zip = "$rel\MaaRacingMaster-$env:VER-win-x64.zip"
          $drill = "${{ github.workspace }}\build\drill"
          $prev = Join-Path $env:RUNNER_TEMP "drill-prev"
          if (Test-Path $prev) { Remove-Item $prev -Recurse -Force }
          Copy-Item $stage $prev -Recurse

          # 合成基线覆盖三类变化：改一个文件、删两个小文件、加一个新文件。
          # 改动必须落在 program\ 内——增量只比较这个子树，改包根的文件演练不到主路径。
          $prevContent = Join-Path $prev "program"
          if (-not (Test-Path $prevContent)) { throw "演练基线缺 program 目录: $prevContent" }
          $changed = Get-ChildItem $prevContent -Recurse -File | Select-Object -First 1
          if (-not $changed) { throw "演练基线为空：$prevContent" }
          Add-Content -Path $changed.FullName -Value "drill" -NoNewline
          $victims = Get-ChildItem $prevContent -Recurse -File |
                     Where-Object { $_.FullName -ne $changed.FullName -and $_.Length -lt 4096 } |
                     Select-Object -First 2
          if (@($victims).Count -lt 2) { throw "演练基线缺少可删除的小文件" }
          foreach ($victim in $victims) { Remove-Item $victim.FullName -Force }
          Set-Content -Path (Join-Path $prevContent "drill-only.txt") -Value "drill"

          New-Item -ItemType Directory -Force -Path $drill | Out-Null
          $oldZip = "$drill\MaaRacingMaster-0.0.0-drill-win-x64.zip"
          python -B -X utf8 scripts/release/make_update_artifacts.py pack --tree $prev --out $oldZip
          if ($LASTEXITCODE -ne 0) { throw "合成基线打包失败" }
          python -B -X utf8 scripts/release/make_update_artifacts.py build `
            --new-tree $stage `
            --new-zip $zip `
            --content-subdir program `
            --version $env:VER `
            --tag "v$env:VER" `
            --prev-zip $oldZip `
            --out $drill
          if ($LASTEXITCODE -ne 0) { throw "更新清单或增量演练失败" }
          Get-ChildItem $drill | Select-Object Name, Length

      - name: 上传验证产物（不创建 Release）
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MaaRacingMaster-${{ steps.version.outputs.version }}-pkgtest
          if-no-files-found: error
          retention-days: 7
          path: |
            build/release/MaaRacingMaster-${{ steps.version.outputs.version }}-win-x64.zip
            build/release/MaaRacingMaster-${{ steps.version.outputs.version }}-win-x64.zip.sha256
            build/release/MaaRacingMaster-infinite_drive-models-${{ steps.version.outputs.version }}.zip
            build/release/MaaRacingMaster-infinite_drive-models-${{ steps.version.outputs.version }}.zip.sha256
